name: Update feed and deploy

on:
  schedule:
    # 6時間ごと (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:        # 手動実行も可能
  push:
    branches: [main]

permissions:
  contents: write           # data/ への自動コミット用
  pages: write              # GitHub Pages デプロイ用
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser requests

      - name: Fetch RSS feeds
        run: python scripts/fetch.py

      - name: Translate new entries
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python scripts/translate.py

      - name: Copy data.json into site/
        run: cp data/data.json site/data.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json site/data.json
          git diff --cached --quiet || git commit -m "chore: update feed [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
